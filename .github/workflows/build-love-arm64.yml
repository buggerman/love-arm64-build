name: Build LÖVE 11.4 ARM64

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: windows-2022

    steps:
      - name: Checkout megasource & LÖVE
        run: |
          git clone --depth 1 --branch 11.4 https://github.com/love2d/megasource.git megasource
          cd megasource
          git clone --depth 1 --branch 11.4 https://github.com/love2d/love.git libs/love

      - name: Patch Dependencies for ARM64
        run: |
          # 1. Strip all x86 Intel SIMD includes (*mmintrin.h) project-wide
          Get-ChildItem -Path "megasource" -Recurse -Include "*.h","*.c","*.cpp" | ForEach-Object {
            $path = $_.FullName
            $text = [System.IO.File]::ReadAllText($path)
            if ($text -match '#\s*include\s*<[a-z]*mmintrin\.h>') {
              $text = [System.Text.RegularExpressions.Regex]::Replace($text, '#\s*include\s*<[a-z]*mmintrin\.h>', '/* disabled x86 SIMD on ARM64 */')
              [System.IO.File]::WriteAllText($path, $text)
            }
          }

          # 2. Patch libvorbis: force scalar fallback on ARM64
          Get-ChildItem -Path "megasource\libs" -Recurse -Filter "os.h" | ForEach-Object {
            $path = $_.FullName
            $text = [System.IO.File]::ReadAllText($path)
            $text = $text.Replace('!defined(_WIN64)', 'defined(_M_IX86)')
            $text = $text.Replace('defined(_WIN64)', 'defined(_M_X64)')
            [System.IO.File]::WriteAllText($path, $text)
          }

          # 3. Patch PhysFS: enforce Little Endian on ARM64
          Get-ChildItem -Path "megasource" -Recurse -Filter "physfs_lzmasdk.h" | ForEach-Object {
            $path = $_.FullName
            $text = [System.IO.File]::ReadAllText($path)
            if (-not $text.Contains("#define MY_CPU_LE 1")) {
              $text = "#define MY_CPU_LE 1`r`n" + $text
            }
            [System.IO.File]::WriteAllText($path, $text)
          }

          # 4. Patch SDL2: inject <intrin.h> and MSVC ARM64 intrinsic pragmas
          $sdlIntrinsicsHeader = @"
          #if defined(_MSC_VER)
          #include <intrin.h>
          #pragma intrinsic(_InterlockedCompareExchange)
          #pragma intrinsic(_InterlockedCompareExchangePointer)
          #pragma intrinsic(_InterlockedExchange)
          #pragma intrinsic(_InterlockedExchangePointer)
          #pragma intrinsic(_InterlockedExchangeAdd)
          #pragma intrinsic(_InterlockedIncrement)
          #pragma intrinsic(_InterlockedDecrement)
          #endif
          "@
          Get-ChildItem -Path "megasource" -Recurse -Include "SDL_atomic.c","SDL_spinlock.c","SDL_syssem.c","SDL_malloc.c","SDL_atomic.h" | ForEach-Object {
            $path = $_.FullName
            $text = [System.IO.File]::ReadAllText($path)
            $text = $text.Replace('defined(_M_IX86) || defined(_M_X64)', 'defined(_M_IX86) || defined(_M_X64) || defined(_M_ARM64)')
            if (-not $text.Contains("#pragma intrinsic(_InterlockedCompareExchange)")) {
              $text = $sdlIntrinsicsHeader + "`r`n" + $text
            }
            [System.IO.File]::WriteAllText($path, $text)
          }

      - name: Configure CMake for ARM64
        working-directory: megasource
        run: |
          cmake -G "Visual Studio 17 2022" -A ARM64 -S . -B build `
            -DLOVE_USE_SDL3=OFF `
            -DLOVE_JIT=OFF `
            -DSDL_MMX=OFF `
            -DSDL_3DNOW=OFF `
            -DSDL_SSE=OFF `
            -DSDL_SSE2=OFF `
            -DSDL_SSE3=OFF `
            -DSDL_AVX=OFF `
            -DSDL_AVX2=OFF `
            -DSDL_AVX512F=OFF `
            -DALSOFT_CPUEXT_NEON=OFF `
            -DALSOFT_CPUEXT_SSE=OFF `
            -DALSOFT_CPUEXT_SSE2=OFF `
            -DALSOFT_CPUEXT_SSE3=OFF `
            -DALSOFT_CPUEXT_SSE4_1=OFF

      - name: Build LÖVE Release Binaries
        working-directory: megasource
        run: |
          cmake --build build --config Release -- /m /clp:ErrorsOnly "/flp:logfile=errors.log;errorsonly"

      - name: Print Targeted Errors (on failure)
        if: failure()
        working-directory: megasource
        run: |
          Write-Host "==================== BUILD ERRORS ====================" -ForegroundColor Red
          $errorFile = Get-ChildItem -Path . -Filter "errors.log" -Recurse | Select-Object -First 1
          if ($errorFile -and (Get-Item $errorFile.FullName).Length -gt 0) {
            Get-Content $errorFile.FullName
          } else {
            Get-ChildItem -Path build -Filter "*.log" -Recurse | ForEach-Object {
              Select-String -Path $_.FullName -Pattern ": error ", "fatal error", "FAILED:" | ForEach-Object {
                $_.Line
              }
            }
          }
          Write-Host "======================================================" -ForegroundColor Red

      - name: Stage Artifacts
        working-directory: megasource
        run: |
          mkdir dist
          Get-ChildItem -Path build -Filter "*.exe" -Recurse | ForEach-Object {
            Copy-Item $_.FullName dist\ -Force
          }
          Get-ChildItem -Path build -Filter "*.dll" -Recurse | ForEach-Object {
            Copy-Item $_.FullName dist\ -Force
          }

      - name: Upload ARM64 Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: love-11.4-windows-arm64
          path: megasource/dist/*
